    <script>
      // Polyfill/fix for browser extensions attempting to assign window.fetch when it has only a getter
      (function() {
        try {
          var origFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return origFetch;
            },
            set: function(fn) {
              origFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // ignore if already configurable
        }

        // Suppress unhandled errors from external browser extensions (e.g. chrome-extension://)
        window.addEventListener('error', function(e) {
          if (
            (e.filename && e.filename.indexOf('chrome-extension:') !== -1) ||
            (e.message && (
              e.message.indexOf('Cannot set property fetch') !== -1 ||
              e.message.indexOf('chrome-extension') !== -1
            ))
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason;
          if (
            reason &&
            ((reason.stack && reason.stack.indexOf('chrome-extension:') !== -1) ||
             (reason.message && reason.message.indexOf('Cannot set property fetch') !== -1))
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
